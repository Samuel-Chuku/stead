[package]
name = "lifeline-spike"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"
hex = "0.4"
omni-transaction = { version = "=0.5.0", default-features = false, features = ["evm"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
