# A second, separate stack for the Sepolia demo contract (sepolia-demo.steadfi.testnet): the
# same bots, its own NEAR keys, Sepolia wallets and logs, so it never shares a nonce or a wallet
# with the main stack. That contract's 3-minute buy-back window is a demo setting.
#   cd stewards/deploy && docker compose -f docker-compose.demo.yml up -d --build
# Secrets on the host (uid 1000, mode 600):
#   /opt/stead/secrets-demo/.env   the demo stewards' EVM keys, NEAR_TX_RPC_URL, ORDERLY_* (hedged), optional SEPOLIA_RPC_URL
#   /opt/stead/secrets-demo/near/  a second NEAR key of the reporter and of each steward
name: stead-demo

x-bot: &bot
  build:
    context: ../..
    dockerfile: stewards/deploy/Dockerfile
  image: stead-bots:local
  restart: always
  environment:
    STEAD_EVM: sepolia
    NEAR_CONTRACT_ID: sepolia-demo.steadfi.testnet
    # market 1: Sepolia LINK/DAI (800k gas cap; an account's first Aave borrow needs ~514k);
    # market 2: WBTC/DAI (8-decimal collateral, 600k cap). Pick with DEMO_MARKET_ID at `up` time.
    STEAD_MARKET_ID: "${DEMO_MARKET_ID:-1}"
    # Neither stack shares a rate limit with the other: the main stack uses FastNEAR for
    # everything; this one reads from dRPC and sends transactions through a keyed RPC set as
    # NEAR_TX_RPC_URL in the secrets .env (dRPC answers long transactions such as
    # report_health with "Internal server error"; rpc.testnet.near.org is deprecated)
    NEAR_RPC_URL: https://near-testnet.drpc.org
    NEAR_RPC_FALLBACK: https://test.rpc.fastnear.com # only while dRPC is failing
    NEAR_CREDENTIALS_DIR: /secrets/near
    KEEPER_INTERVAL_MS: "6000"
    STEWARD_INTERVAL_MS: "5000"
    # no rescue live on this market: poll every 10 s (a new auction is seen ≤ 10 s after it opens,
    # well inside its 45 s); full speed again as soon as one is live
    STEWARD_IDLE_INTERVAL_MS: "10000"
    # the stewards join through register_steward and mint test tokens on first start
    STEWARD_FUND_ON_START: "true"
    AI_BASE_URL: https://cloud-api.near.ai/v1
    AI_REQUIRE_SIGNATURE: "true"
  volumes:
    - /opt/stead/secrets-demo/.env:/app/.env:ro
    - /opt/stead/secrets-demo/near:/secrets/near:ro
    - /opt/stead/logs-demo:/app/stewards/logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  mem_limit: 384m

services:
  keeper:
    <<: *bot
    command: ["scripts/keeper.ts"]
  steward-patient:
    <<: *bot
    command: ["scripts/steward.ts", "patient"]
  steward-swift:
    <<: *bot
    command: ["scripts/steward.ts", "swift"]
  steward-deep:
    <<: *bot
    command: ["scripts/steward.ts", "deep"]
  steward-pool:
    <<: *bot
    command: ["scripts/steward.ts", "pool"]
  # shorts the top-up asset on Orderly TESTNET while its claim is open (WBTC → PERP_BTC_USDC);
  # venue keys ORDERLY_EVM_KEY / ORDERLY_KEY_SEED in the secrets .env
  steward-hedged:
    <<: *bot
    command: ["scripts/steward.ts", "hedged"]

  # ── public read-only live feed and the demo runner, behind Stead's own Cloudflare tunnel ──
  # Nothing here publishes a host port: the tunnel reaches live-feed on the stack's network, and
  # live-feed passes /demo/start and /demo/status to the runner.
  live-feed:
    <<: *bot
    # its own image tag: building it never rebuilds the running keeper and stewards
    image: stead-live:local
    command: ["scripts/live-feed.ts", "--serve", "8788", "--host", "0.0.0.0"]
    environment:
      STEAD_EVM: sepolia
      DEMO_RUNNER_URL: http://demo-runner:8789
      MAINNET_PANEL_URL: http://mainnet-panel:8787
    # only the testnet node URL (QUICKNODE_NEAR_TESTNET_URL): no keys
    volumes:
      - /opt/stead/secrets-live/.env:/app/.env:ro
    mem_limit: 256m
  # starts a real testnet rescue on a demo borrower's position when a visitor clicks; holds only
  # the two demo borrowers' NEAR keys, their Sepolia payout keys and the reserve wallet's key
  demo-runner:
    <<: *bot
    image: stead-live:local
    command: ["scripts/demo-runner.ts", "--port", "8789", "--host", "0.0.0.0"]
    environment:
      STEAD_EVM: sepolia
      NEAR_CONTRACT_ID: sepolia-demo.steadfi.testnet
      STEAD_MARKET_ID: "1"
      NEAR_RPC_URL: https://near-testnet.drpc.org
      NEAR_RPC_FALLBACK: https://test.rpc.fastnear.com
      NEAR_CREDENTIALS_DIR: /secrets/near
      DEMO_STATE_FILE: /app/state/demo-slots.json
      DEMO_ALLOWED_ORIGINS: https://app.usestead.xyz,https://usestead.xyz
    volumes:
      - /opt/stead/secrets-demo-runner/.env:/app/.env:ro
      - /opt/stead/secrets-demo-runner/near:/secrets/near:ro
      - /opt/stead/state-demo:/app/state
      - /opt/stead/logs-demo:/app/stewards/logs
    mem_limit: 256m
  # read-only: real Aave V3 positions and liquidations on Ethereum mainnet, public RPCs only, no keys;
  # served at /mainnet.json through live-feed
  mainnet-panel:
    <<: *bot
    image: stead-live:local
    command: ["scripts/mainnet-panel.ts", "--serve", "8787", "--host", "0.0.0.0", "--every", "300", "--out", "/app/state/mainnet-panel.json", "--state", "/app/state/mainnet-panel-state.json"]
    environment:
      STEAD_EVM: sepolia
    volumes:
      - /opt/stead/state-mainnet:/app/state
    mem_limit: 384m
  # the site (usestead.xyz and app.usestead.xyz): the built front end (web/dist), served read-only
  web:
    image: nginx:1.31.7-alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    restart: always
    volumes:
      - /opt/stead/web:/usr/share/nginx/html:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 64m
  tunnel:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: always
    # TUNNEL_TOKEN only (live.usestead.xyz → http://live-feed:8788)
    env_file: /opt/stead/secrets-tunnel/.env
    depends_on: [live-feed]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m
